# Drop into /etc/postgresql/16/main/conf.d/raga-lowmem.conf on the droplet, then:
#   sudo systemctl restart postgresql
# Targets ~100-150 MB total RAM for a small store (a few hundred orders/day is fine).
listen_addresses = 'localhost'
max_connections = 20            # API pool is 5 + 5 overflow per worker
shared_buffers = 32MB
effective_cache_size = 192MB
work_mem = 2MB
maintenance_work_mem = 16MB
wal_buffers = 1MB
min_wal_size = 64MB
max_wal_size = 256MB
huge_pages = off
jit = off
max_worker_processes = 4
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
autovacuum_max_workers = 2
